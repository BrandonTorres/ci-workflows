name: Build and Publish Container Image

on:
  workflow_call:
    inputs:
      image-name:
        description: "GHCR image path under ghcr.io/ (defaults to github.repository lowercased)"
        required: false
        type: string
        default: ""
      dockerfile:
        description: "Path to Dockerfile relative to repository root"
        required: false
        type: string
        default: "Dockerfile"
      context:
        description: "Docker build context path"
        required: false
        type: string
        default: "."
      build-args:
        description: "Additional newline-separated Docker build-args (APP_SHA is always passed)"
        required: false
        type: string
        default: ""
      platforms:
        description: "Target platforms for buildx"
        required: false
        type: string
        default: "linux/amd64"
    outputs:
      digest:
        description: "Built image digest"
        value: ${{ jobs.build.outputs.digest }}
      tags:
        description: "Image tags produced"
        value: ${{ jobs.build.outputs.tags }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine push eligibility
        id: push-gate
        shell: bash
        run: |
          # Only default/master/main branch builds push; PR builds validate without pushing.
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" || "${GITHUB_EVENT_NAME}" == "pull_request_target" ]]; then
            echo "should_push=false" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == "refs/heads/master" || "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_REF}" == "refs/heads/${{ github.event.repository.default_branch }}" ]]; then
            echo "should_push=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.push-gate.outputs.should_push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ inputs.image-name || github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ steps.push-gate.outputs.should_push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_SHA=${{ github.sha }}
            ${{ inputs.build-args }}
          cache-from: type=gha,scope=${{ inputs.image-name || github.event.repository.name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image-name || github.event.repository.name }}
